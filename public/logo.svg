<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Background Hexagon / Rounded Shield -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#primaryGrad)" filter="url(#shadow)" />
    
    <!-- Open Book Symbol -->
    <path d="M 28 66 C 36 60, 44 60, 50 63 C 56 60, 64 60, 72 66 L 72 44 C 64 38, 56 38, 50 41 C 44 38, 36 38, 28 44 Z" fill="#FFFFFF" />
    <path d="M 50 41 L 50 63" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    
    <!-- Torch Flame / Knowledge Star -->
    <path d="M 50 24 C 47 28, 45 32, 50 36 C 55 32, 53 28, 50 24 Z" fill="url(#goldGrad)" />
    
    <!-- Graduation Cap / Arch -->
    <polygon points="50,18 36,25 50,32 64,25" fill="#F8FAFC" opacity="0.9" />
    <path d="M 60 27 L 62 38" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
    <circle cx="62" cy="39" r="2" fill="#F59E0B" />
  </g>

  <!-- Typography: ICC KE GURUJI -->
  <text x="120" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#1E293B" letter-spacing="1">
    ICC <tspan fill="url(#primaryGrad)">KE GURUJI</tspan>
  </text>
  
  <!-- Slogan / Subtitle -->
  <text x="122" y="84" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="2">
    EXCELLENCE IN LEARNING • LIVE CLASSES &amp; AI TUTOR
  </text>
  
  <!-- Golden Accent Ribbon Bar -->
  <rect x="122" y="93" width="70" height="3.5" rx="1.75" fill="url(#goldGrad)" />
</svg>
