name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          cd apps/student-app
          npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://gshjxcoyfrskxnpdqooy.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzaGp4Y295ZnJza3hucGRxb295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NDE4MzEsImV4cCI6MjExMDExNzgzMX0.LUFOdUFv30uWvf1SdCoHo8vaewxquRq3JRRNrxHL-8g

      - name: Configure Kotlin for Compose Compatibility
        run: |
          sed -i 's/1.9.24/1.9.25/g' apps/student-app/android/build.gradle
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> apps/student-app/android/gradle.properties

      - name: Build Release APK
        run: |
          cd apps/student-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/student-app/android/app/build/outputs/apk/release/*.apk dist/ideal-coaching-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideal-coaching-release-apk
          path: dist/ideal-coaching-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "IDEAL COACHING CENTRE Student App v1.0.0"
          body: |
            ### 📱 IDEAL COACHING CENTRE — Student Android App
            Official Release v1.0.0 (BSEB & JAC Board Curriculum)
            
            - Download `ideal-coaching-release.apk` below and install on any Android phone (Android 7.0+).
          files: dist/ideal-coaching-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
