name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Auto-Bump App Version & Extract Changelog
        id: ver
        run: |
          RUN_NUM=${{ github.run_number }}
          VER_CODE=$((3 + RUN_NUM))
          VER_NAME="1.0.$((2 + RUN_NUM))"
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          node -e "
            const fs = require('fs');
            const p = 'apps/student-app/app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.version = '$VER_NAME';
            j.expo.android.versionCode = $VER_CODE;
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          "
          git log -5 --pretty=format:"%s" > /tmp/changelog.txt
          cat /tmp/changelog.txt

      - name: Generate Android Native Project (Expo Prebuild)
        run: |
          cd apps/student-app
          npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://gshjxcoyfrskxnpdqooy.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzaGp4Y295ZnJza3hucGRxb295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NDE4MzEsImV4cCI6MjExMDExNzgzMX0.LUFOdUFv30uWvf1SdCoHo8vaewxquRq3JRRNrxHL-8g

      - name: Configure Kotlin, Compression and APK Size Optimization
        run: |
          echo "android.kotlinVersion=1.9.25" >> apps/student-app/android/gradle.properties
          echo "kotlinVersion=1.9.25" >> apps/student-app/android/gradle.properties
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' apps/student-app/android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> apps/student-app/android/gradle.properties
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' apps/student-app/android/gradle.properties || echo "reactNativeArchitectures=arm64-v8a" >> apps/student-app/android/gradle.properties
          sed -i 's/expo.useLegacyPackaging=false/expo.useLegacyPackaging=true/' apps/student-app/android/gradle.properties || echo "expo.useLegacyPackaging=true" >> apps/student-app/android/gradle.properties
          echo "android.enableProguardInReleaseBuilds=true" >> apps/student-app/android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> apps/student-app/android/gradle.properties
          echo "android.enableR8.fullMode=true" >> apps/student-app/android/gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=true" >> apps/student-app/android/gradle.properties

          cat << 'EOF' >> apps/student-app/android/app/proguard-rules.pro
          -dontwarn **
          -keep class com.swmansion.reanimated.** { *; }
          -keep class com.facebook.react.** { *; }
          -keep class expo.modules.** { *; }
          -keep class com.horcrux.svg.** { *; }
          -keep class com.reactnativecommunity.webview.** { *; }
          -keepclassmembers class com.reactnativecommunity.webview.** { *; }
          -keep class com.idealcoaching.app.** { *; }
          -keep class com.pedro.** { *; }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -assumenosideeffects class android.util.Log {
              public static boolean isLoggable(java.lang.String, int);
              public static int v(...);
              public static int d(...);
              public static int i(...);
          }
          EOF

          cat << 'EOF' >> apps/student-app/android/build.gradle

          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          EOF

      - name: Build Release APK (Optimized 64-bit ARM with Compressed JNI)
        run: |
          cd apps/student-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25 -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/student-app/android/app/build/outputs/apk/release/*.apk dist/ideal-coaching-release.apk
          ls -lh dist/ideal-coaching-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideal-coaching-release-apk
          path: dist/ideal-coaching-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: "IDEAL COACHING CENTRE App v${{ steps.ver.outputs.version_name }}"
          body: |
            ### 📱 IDEAL COACHING CENTRE — Student & Director Android App
            Official Release v${{ steps.ver.outputs.version_name }} (Build ${{ steps.ver.outputs.version_code }})

            **What's New:**
            - Latest improvements, dark mode, AI Quiz, live classes & performance upgrades.
            - Download `ideal-coaching-release.apk` below and install on any Android phone (Android 7.0+).
          files: dist/ideal-coaching-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Publish Version & Changelog to Live App Update API
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("/tmp/changelog.txt", "utf8").split("\n").map(s => s.trim()).filter(Boolean);
            const verName = "${{ steps.ver.outputs.version_name }}";
            const verCode = Number("${{ steps.ver.outputs.version_code }}");
            const apkUrl = "https://github.com/${{ github.repository }}/releases/download/v" + verName + "/ideal-coaching-release.apk";
            const payload = {
              key: "app_update_config",
              value: {
                latest_version: verName,
                version_code: verCode,
                min_required_version: "1.0.0",
                is_mandatory: false,
                apk_download_url: apkUrl,
                apk_size_mb: 21.0,
                release_date: new Date().toISOString().split("T")[0],
                title_en: "New Update Available (v" + verName + ")",
                title_hi: "नया आधिकारिक अपडेट उपलब्ध है (v" + verName + ")",
                changelog_en: lines.length ? lines : ["Performance improvements and bug fixes"],
                changelog_hi: lines.length ? lines : ["बेहतर परफॉर्मेंस एवं बग फिक्स"]
              },
              updated_at: new Date().toISOString()
            };
            const url = "https://gshjxcoyfrskxnpdqooy.supabase.co/rest/v1/platform_settings?on_conflict=key";
            const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzaGp4Y295ZnJza3hucGRxb295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NDE4MzEsImV4cCI6MjExMDExNzgzMX0.LUFOdUFv30uWvf1SdCoHo8vaewxquRq3JRRNrxHL-8g";
            fetch(url, {
              method: "POST",
              headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" },
              body: JSON.stringify(payload)
            }).then(r => console.log("App update published:", r.status)).catch(console.error);
          '
