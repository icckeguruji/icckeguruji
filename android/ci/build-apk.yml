name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Compile & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Signing Keystore
        run: |
          cd android/app
          if [ ! -f "release.keystore" ]; then
            echo "Generating automated release signing keystore..."
            keytool -genkey -v \
              -keystore release.keystore \
              -alias icckeguruji \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass icckeguruji123 \
              -keypass icckeguruji123 \
              -dname "CN=ICC KE GURUJI, OU=Coaching, O=ICC KE GURUJI, L=Patna, S=Bihar, C=IN"
          fi

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          gradle assembleRelease || ./gradlew assembleRelease --stacktrace

      - name: Collect & Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found compiled APK: $APK_PATH"
            cp "$APK_PATH" build-output/icckeguruji.apk
            cp "$APK_PATH" build-output/icckeguruji-v1.0.0.apk
          else
            echo "Error: Release APK was not generated!"
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icckeguruji-android-apk
          path: build-output/*.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ICC KE GURUJI Android App v1.0.0"
          body: |
            ### 📲 Official ICC KE GURUJI Android App (v1.0.0)

            Direct Android Application package (.APK) for students, parents, and faculties of **ICC KE GURUJI** Coaching Institute.

            #### ✨ Key Features:
            - **Live YouTube Classroom**: Distraction-free live lectures without browser bars.
            - **Golden PDF Notes Reader**: Chapter-wise handwritten notes with offline caching.
            - **24/7 AI Guruji Doubt Solver**: Instant step-by-step problem derivations.
            - **Sunday Mock Quiz Hub**: Real-time timed speed test engine.
            - **UPI Fee Payments**: 1-click WhatsApp & PhonePe/GPay fee receipts.
            - **Zero Third-Party Ads**: 100% focused education experience.

            #### 📥 Installation Steps:
            1. Download `icckeguruji.apk` below.
            2. If Android warns *"File might be harmful"*, tap **Download anyway**.
            3. Tap on the downloaded file and choose **Install** (allow unknown sources if prompted).
            4. Launch and start learning!
          files: |
            build-output/icckeguruji.apk
            build-output/icckeguruji-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
